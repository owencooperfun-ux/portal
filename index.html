<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NextDNS PATCH Request Example</title>
</head>
<body>

    <h1>Update NextDNS Profile</h1>
    <button id="updateBtn">Turn Off YouTube</button>
    <p id="result"></p>

    <script>
        const profileId = "b97e76";
        const apiKey = "89f3bbf5ab2e87d54caa68c45ca8a5823e2cced3";
        const url = `https://api.nextdns.io/profiles/${profileId}/parentalControl/services/youtube`;

        document.getElementById('updateBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(url, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Api-Key': apiKey
                    },
                    body: JSON.stringify({ active: false })
                });

                if (response.ok) {
                    document.getElementById('result').innerText = "Successfully updated NextDNS profile!";
                } else {
                    document.getElementById('result').innerText = `Error: ${response.status} ${response.statusText}`;
                }
            } catch (error) {
                console.error('Request failed:', error);
                document.getElementById('result').innerText = "Request failed. Check console.";
            }
        });
    </script>

</body>
</html>
