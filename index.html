<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextDNS Control</title>
<style>
  :root{color-scheme:dark;--bg:#0b0d12;--card:#141821;--card2:#10131a;--text:#f4f6fb;--muted:#9299a8;--line:#272d3a;--accent:#6ea8fe;--danger:#ff6b6b;--ok:#52d273}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at top,#192238 0,#0b0d12 42%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}
  .wrap{width:min(1000px,92vw);margin:0 auto;padding:42px 0 70px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:26px}
  h1{font-size:30px;margin:0}.sub{color:var(--muted);margin-top:6px}
  .status{border:1px solid var(--line);background:#11151d;padding:9px 13px;border-radius:999px;font-size:13px;white-space:nowrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:7px}.ok{background:var(--ok)}
  .card{background:rgba(20,24,33,.9);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 14px 35px #0003}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 8px}
  input{width:100%;padding:12px 13px;background:#0c0f15;border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6ea8fe18}
  button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#07111f;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.08)}button.secondary{background:#252c39;color:var(--text)}button.danger{background:#3a2024;color:#ffb4b4}
  .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
  .hidden{display:none!important}
  .sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  h2{font-size:18px;margin:0}
  .count{color:var(--muted);font-size:13px}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;background:var(--card2);border:1px solid var(--line);border-radius:10px}
  .domain{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:10px}
  .message{padding:12px 14px;border-radius:10px;margin-bottom:15px;background:#18202d;border:1px solid #2c384d;color:#dce7ff}
  .message.error{background:#2a171b;border-color:#54272e;color:#ffc5ca}
  .message.success{background:#13251a;border-color:#254e30;color:#c6ffd0}
  .modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:5}
  .modalbox{width:min(480px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .modalbox h3{margin-top:0}.modalbox input{margin-bottom:12px}
  .footer{color:var(--muted);font-size:12px;text-align:center;margin-top:25px}
  @media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.status{align-self:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div id="setupView">
    <div class="top">
      <div><h1>⚡ NextDNS Control</h1><div class="sub">personal NextDNS profile controller</div></div>
    </div>
    <div class="card">
      <div id="setupMessage" class="hidden"></div>
      <div class="grid">
        <div>
          <label for="profile">Setup / Profile ID</label>
          <input id="profile" autocomplete="off" placeholder="e.g. 963c99">
        </div>
        <div>
          <label for="apiKey">API key</label>
          <input id="apiKey" type="password" autocomplete="off" placeholder="paste your NextDNS API key">
        </div>
      </div>
      <div class="actions">
        <button id="saveBtn">Save & load profile</button>
      </div>
      <p class="sub" style="font-size:12px;margin-top:14px">your credentials are stored only in this browser's local storage. don't publish this file with your API key inside it.</p>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="top">
      <div><h1>⚡ NextDNS Control</h1><div class="sub" id="profileLabel"></div></div>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Loading…</span></div>
    </div>

    <div id="message" class="hidden"></div>

    <div class="card">
      <div class="sectionhead">
        <h2>Denylist</h2><span id="denyCount" class="count"></span>
      </div>
      <div class="actions" style="margin-top:0;margin-bottom:13px">
        <input id="denyInput" placeholder="example.com" style="flex:1;min-width:200px">
        <button id="denyAdd">+ Add</button>
      </div>
      <div id="denyList" class="list"></div>
    </div>

    <div class="card">
      <div class="sectionhead">
        <h2>Allowlist</h2><span id="allowCount" class="count"></span>
      </div>
      <div class="actions" style="margin-top:0;margin-bottom:13px">
        <input id="allowInput" placeholder="example.com" style="flex:1;min-width:200px">
        <button id="allowAdd">+ Add</button>
      </div>
      <div id="allowList" class="list"></div>
    </div>

    <div class="actions">
      <button id="refreshBtn" class="secondary">↻ Refresh</button>
      <button id="settingsBtn" class="secondary">⚙ Settings</button>
      <button id="forgetBtn" class="danger">Forget credentials</button>
    </div>
    <div class="footer">NextDNS API · profile <span id="footerProfile"></span></div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modalbox">
    <h3>Settings</h3>
    <label for="modalProfile">Setup / Profile ID</label>
    <input id="modalProfile">
    <label for="modalKey">API key</label>
    <input id="modalKey" type="password">
    <div class="actions">
      <button id="modalSave">Save & reload</button>
      <button id="modalCancel" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<script>
"use strict";

const STORAGE_KEY = "nextdns-controller-v1";
const API_BASE = "https://api.nextdns.io";

const $ = id => document.getElementById(id);
let cfg = null;
let profileData = null;

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
  catch { return null; }
}

function saveSaved(profile, apiKey) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({profile, apiKey}));
}

function clearSaved() {
  localStorage.removeItem(STORAGE_KEY);
}

function showMessage(text, type="") {
  const el = $("message");
  el.textContent = text;
  el.className = "message " + type;
  el.classList.remove("hidden");
}

function showSetupMessage(text, type="error") {
  const el = $("setupMessage");
  el.textContent = text;
  el.className = "message " + type;
  el.classList.remove("hidden");
}

function setStatus(text, connected=false) {
  $("statusText").textContent = text;
  $("statusDot").classList.toggle("ok", connected);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function cleanDomain(value) {
  let d = value.trim().toLowerCase();
  d = d.replace(/^https?:\/\//, "").split("/")[0];
  return d;
}

async function api(path, options={}) {
  const response = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "X-Api-Key": cfg.apiKey,
      "Accept": "application/json",
      ...(options.body ? {"Content-Type":"application/json"} : {}),
      ...(options.headers || {})
    }
  });

  let body = null;
  try { body = await response.json(); } catch {}

  if (!response.ok) {
    const detail = body?.errors?.map(e => e.detail || e.code).join("; ");
    throw new Error(detail || `HTTP ${response.status}`);
  }

  if (body?.errors?.length) {
    throw new Error(body.errors.map(e => e.detail || e.code).join("; "));
  }

  return body;
}

async function loadProfile() {
  setStatus("Connecting…");
  try {
    const result = await api(`/profiles/${encodeURIComponent(cfg.profile)}`);
    profileData = result.data;
    render();
    setStatus("Connected", true);
    showMessage("profile loaded successfully", "success");
    setTimeout(() => $("message").classList.add("hidden"), 2200);
  } catch (err) {
    setStatus("Connection failed");
    showMessage("couldn't load the profile: " + err.message, "error");
  }
}

function renderList(containerId, items, kind) {
  const el = $(containerId);
  if (!Array.isArray(items) || !items.length) {
    el.innerHTML = `<div class="empty">nothing here yet</div>`;
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="item">
      <span class="domain">${escapeHtml(item.id)}</span>
      <button class="danger" data-kind="${kind}" data-domain="${encodeURIComponent(item.id)}">Remove</button>
    </div>
  `).join("");

  el.querySelectorAll("button[data-kind]").forEach(btn => {
    btn.addEventListener("click", () =>
      removeDomain(btn.dataset.kind, decodeURIComponent(btn.dataset.domain))
    );
  });
}

function render() {
  const deny = profileData?.denylist || [];
  const allow = profileData?.allowlist || [];

  $("profileLabel").textContent = `${profileData?.name || "NextDNS profile"} · ${cfg.profile}`;
  $("footerProfile").textContent = cfg.profile;
  $("denyCount").textContent = `${deny.length} domain${deny.length === 1 ? "" : "s"}`;
  $("allowCount").textContent = `${allow.length} domain${allow.length === 1 ? "" : "s"}`;

  renderList("denyList", deny, "denylist");
  renderList("allowList", allow, "allowlist");
}

async function addDomain(kind) {
  const input = kind === "denylist" ? $("denyInput") : $("allowInput");
  const domain = cleanDomain(input.value);

  if (!domain) return;
  if (!/^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i.test(domain)) {
    showMessage("please enter a normal domain such as example.com", "error");
    return;
  }

  try {
    setStatus("Updating…");
    await api(`/profiles/${encodeURIComponent(cfg.profile)}/${kind}`, {
      method: "POST",
      body: JSON.stringify({id: domain})
    });
    input.value = "";
    await loadProfile();
  } catch (err) {
    setStatus("Connected", true);
    showMessage("couldn't add " + domain + ": " + err.message, "error");
  }
}

async function removeDomain(kind, domain) {
  if (!confirm(`remove ${domain} from the ${kind}?`)) return;

  try {
    setStatus("Updating…");
    await api(`/profiles/${encodeURIComponent(cfg.profile)}/${kind}/${encodeURIComponent(domain)}`, {
      method: "DELETE"
    });
    await loadProfile();
  } catch (err) {
    setStatus("Connected", true);
    showMessage("couldn't remove " + domain + ": " + err.message, "error");
  }
}

function openApp() {
  $("setupView").classList.add("hidden");
  $("appView").classList.remove("hidden");
}

function openSetup() {
  $("appView").classList.add("hidden");
  $("setupView").classList.remove("hidden");
}

async function saveAndLoad(profile, apiKey) {
  profile = profile.trim();
  apiKey = apiKey.trim();

  if (!profile || !apiKey) {
    showSetupMessage("enter both your setup/profile ID and API key.");
    return;
  }

  cfg = {profile, apiKey};
  saveSaved(profile, apiKey);
  openApp();
  await loadProfile();
}

$("saveBtn").addEventListener("click", () =>
  saveAndLoad($("profile").value, $("apiKey").value)
);

$("denyAdd").addEventListener("click", () => addDomain("denylist"));
$("allowAdd").addEventListener("click", () => addDomain("allowlist"));

$("denyInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addDomain("denylist");
});
$("allowInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addDomain("allowlist");
});

$("refreshBtn").addEventListener("click", loadProfile);

$("settingsBtn").addEventListener("click", () => {
  $("modalProfile").value = cfg.profile;
  $("modalKey").value = cfg.apiKey;
  $("modal").classList.remove("hidden");
});

$("modalCancel").addEventListener("click", () => $("modal").classList.add("hidden"));

$("modalSave").addEventListener("click", async () => {
  $("modal").classList.add("hidden");
  await saveAndLoad($("modalProfile").value, $("modalKey").value);
});

$("forgetBtn").addEventListener("click", () => {
  if (!confirm("forget the saved NextDNS credentials?")) return;
  clearSaved();
  cfg = null;
  profileData = null;
  openSetup();
  $("profile").value = "";
  $("apiKey").value = "";
});

(async function init() {
  const saved = loadSaved();

  if (saved?.profile && saved?.apiKey) {
    cfg = saved;
    openApp();
    await loadProfile();
  } else {
    openSetup();
  }
})();
</script>
</body>
</html>
